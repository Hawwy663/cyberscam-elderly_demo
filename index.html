<!DOCTYPE html>
<html lang="zh-HK">

    <title>防騙先鋒---version 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght=700;900&display=swap');
        body { 
            font-family: 'Noto Sans HK', sans-serif; 
            background-color: #020617; 
            color: #f1f5f9;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-panel { 
            background: rgba(15, 23, 42, 0.98); 
            backdrop-filter: blur(24px); 
            border: 2px solid rgba(255, 255, 255, 0.15);
        }
        .tag-mystery { 
            padding: 8px 16px; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: 900; 
            margin: 6px; 
            display: inline-block; 
            background: #334155; 
            color: #f8fafc; 
            border: 2px solid #64748b; 
        }
        .tag-green { background: #10b981 !important; border-color: #34d399 !important; color: #ffffff; }
        .tag-red { background: #ef4444 !important; border-color: #f87171 !important; color: #ffffff; }
        .btn-disabled { opacity: 0.4; cursor: not-allowed; background-color: #475569 !important; }

</head>
<body class="min-h-screen w-screen flex flex-col items-center justify-start bg-slate-950 p-3 overflow-y-auto select-none">

    <div id="intro-screen" class="glass-panel rounded-3xl max-w-md w-full p-5 flex flex-col text-center shadow-2xl my-auto">
        <div>
            <div class="text-6xl my-2">🛡️</div>
            <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-400 to-amber-400 mb-2">防騙模擬器</h1>
            <p class="text-xl text-amber-300 font-bold mb-4">與騙徒嘅鬥智鬥勇（共 6 輪）</p>
            
            <div class="bg-slate-900/90 border-2 border-white/10 rounded-2xl p-4 text-left text-base text-slate-200 space-y-3">
                <p class="font-black text-amber-400 text-lg mb-1">📖 玩法與雙重限制說明：</p>
                <p>• <span class="text-white font-black">灰色訊息：</span>對方的說話與線索真假未明。</p>
                <p>• <span class="text-indigo-300 font-black">繼續傾下：</span>幫你抽絲剝繭，變<span class="text-emerald-400 font-black">綠色安全手段</span>或<span class="text-rose-400 font-black">紅色詐騙破綻</span>。</p>
                <p class="text-rose-400 font-bold">⚠️ 次數限制：每回合最多傾 3 次，且全場全局共享 6 次！請將 quota 留喺最可疑嘅關卡。</p>
                <p>• <span class="text-amber-300 font-black">最終目標：</span>守住積蓄，且不誤拒真正有需要的親友！</p>
            </div>
        </div>
        <button onclick="startGame()" class="w-full py-4 bg-gradient-to-r from-amber-500 to-red-600 text-white font-black text-2xl rounded-2xl shadow-lg active:scale-95 transition-transform mt-5">▶️ 開始挑戰</button>
    </div>

    <div id="game-container" class="hidden w-full max-w-md glass-panel rounded-3xl flex flex-col shadow-2xl my-auto h-auto overflow-hidden">
        
        <div class="px-4 py-4 border-b-2 border-white/10 flex justify-between bg-slate-900/70 items-center">
            <h1 class="text-xl font-black text-amber-400">🛡️ 防騙情報局</h1>
            <div class="text-base font-black text-slate-300">第 <span id="turn-count" class="font-black text-2xl text-white">01</span> / <span id="total-round-count" class="text-white font-black text-2xl">06</span> 輪</div>
        </div>

        <div class="flex items-center justify-center space-x-3 bg-slate-900/40 p-2 rounded-2xl border border-white/5">
    <div id="avatar" class="text-4xl flex-shrink-0"></div>
    <h2 id="scam-title" class="text-xl md:text-2xl font-black text-white leading-snug text-left"></h2>
</div>
            
            <div id="log" class="bg-slate-950 border-2 border-white/10 rounded-xl p-4 text-xl font-bold leading-relaxed text-slate-100 h-auto"></div>

            <div id="hint-box" class="invisible min-h-[40px] bg-amber-500/20 border-2 border-amber-500/50 rounded-xl flex items-center justify-center text-center px-3 text-sm font-black text-amber-300">

            </div>

            </div>

            <div class="space-y-2.5 pt-2">

                    <span class="text-xs text-indigo-200 font-bold" id="chat-text-sub">抽絲剝繭核實線索真偽</span>
                </button>
                <div class="grid grid-cols-2 gap-2.5">
                    <button onclick="takeAction('small')" class="py-3 bg-emerald-700 active:scale-[0.98] rounded-xl font-black transition-all flex flex-col items-center justify-center shadow-md">
                        <span class="text-base text-white">💰 轉住少少錢先</span>
                        <span class="text-xs text-emerald-200 font-bold">姑且相信/試探</span>
                    </button>
                    <button onclick="takeAction('big')" class="py-3 bg-red-700 active:scale-[0.98] rounded-xl font-black transition-all flex flex-col items-center justify-center shadow-md">
                        <span class="text-base text-white">🔥 聽話轉大額錢</span>
                        <span class="text-xs text-red-100 font-bold">高風險！易清空</span>
                    </button>
                </div>
                <button onclick="takeAction('refuse')" class="w-full py-3 bg-slate-700 active:scale-[0.98] text-base rounded-xl font-black transition-all flex flex-col items-center justify-center shadow-md">
                    <span class="text-white">👋 唔信佢！即刻收線 / 拒絕</span>
                    <span class="text-xs text-slate-300 font-bold">安全拒絕騙徒 / 但可能錯怪親友</span>
                </button>
            </div>
        </div>

        <div class="p-4 border-t-2 border-white/10 bg-slate-950">
            <button id="check-btn" onclick="goToCheck()" class="w-full py-3 bg-cyan-600 active:scale-[0.98] rounded-xl font-black transition-all flex flex-col items-center justify-center shadow-lg">
                <span class="text-lg text-white">🛡️ 打 18222 防騙易熱線查證</span>
                <span class="text-xs text-cyan-100 font-bold">直接安全跳過呢輪 (全場限用一次)</span>
            </button>
        </div>
    </div>

    <div id="modal-screen" class="hidden fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-50">
        <div class="glass-panel rounded-3xl max-w-md w-full p-5 text-center border-2 border-cyan-500 h-auto">
            <div class="text-4xl mb-1">📞</div>
            <h3 class="text-xl font-black text-cyan-400 mb-2">防騙易熱線 查證報告</h3>
            <p id="modal-message" class="text-lg text-slate-100 mb-4 bg-slate-900 p-4 rounded-xl text-left border border-white/10 whitespace-pre-line leading-relaxed font-bold"></p>
            <button onclick="closeModal()" class="w-full py-3 bg-cyan-600 text-white font-black text-base rounded-xl shadow-md">明白，返回遊戲 🔍</button>
        </div>
    </div>

    <div id="end-screen" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="glass-panel rounded-3xl max-w-md w-full p-5 flex flex-col text-center border-2 border-white/30 h-auto my-auto">

            <h2 id="end-title" class="text-2xl font-black mb-2"></h2>
            <p id="end-message" class="text-base mb-4 leading-relaxed text-slate-200 font-bold"></p>
            
            <div class="bg-slate-900/80 border border-white/10 rounded-xl p-3 mb-4 text-base font-black">
                <p id="end-round-status" class="text-cyan-400"></p>
            </div>
            
            <p class="text-sm font-black text-slate-400 text-left mb-1">📋 你的完整行動歷程記錄：</p>
            <div id="risk-history" class="bg-slate-950 rounded-xl p-4 text-left text-sm font-bold space-y-2 border border-white/10 h-auto mb-4"></div>
            
            <button onclick="restartGame()" class="w-full py-3 bg-gradient-to-r from-slate-100 to-white text-slate-900 font-black text-lg rounded-xl shadow-xl active:scale-95 transition-transform mb-3">再玩一次 🔄</button>

        </div>
    </div>

        let roundChatCount = 0;

                    { text: "你自行打開官方網購 App（如淘寶或 HKTVmall），確認物流狀態確實顯示「正在派送中」", origin: "good" }

            }
        ];

        function generateFlagsForScenario(scamObj) {
            let flags = [...scamObj.flags];
            let scamTriggers = flags.filter(f => f.origin === "scam").sort(() => 0.5 - Math.random()).slice(0, 2);
            let safeTriggers = flags.filter(f => f.origin === "good").sort(() => 0.5 - Math.random()).slice(0, 1);
            
            let finalTags = [...scamTriggers, ...safeTriggers].map(f => {
                return { text: f.text, status: "mystery", origin: f.origin };
            });

            return finalTags.sort(() => Math.random() - 0.5);
        }

        function updateUI() {
            document.getElementById('turn-count').textContent = String(round).padStart(2, '0');
            document.getElementById('total-round-count').textContent = String(TOTAL_ROUNDS).padStart(2, '0');
            updateChatButton();
        }

        function renderTags() {
            const container = document.getElementById('tags-container');
            container.innerHTML = currentTags.map(tag => {
                let classType = "tag-mystery"; let prefix = "❓";
                if (tag.status === 'green') { classType += " tag-green"; prefix = "🟢"; }
                if (tag.status === 'red') { classType += " tag-red"; prefix = "🔴"; }
                return `<span class="${classType}">${prefix} ${tag.text}</span>`;
            }).join('');
        }

        function showHint(text, isAlert = false) {
            const hBox = document.getElementById('hint-box');
            hBox.textContent = text; 
            hBox.classList.remove('invisible');
            if (isAlert) {
                hBox.className = "min-h-[40px] bg-red-500/20 border-2 border-red-500/50 rounded-xl flex items-center justify-center text-center px-3 text-sm font-black text-red-300 animate-pulse";
            } else {
                hBox.className = "min-h-[40px] bg-amber-500/20 border-2 border-amber-500/50 rounded-xl flex items-center justify-center text-center px-3 text-sm font-black text-amber-300";
            }
        }

        function clearHint() { document.getElementById('hint-box').classList.add('invisible'); }

        function showNewScam() {
            clearHint();
            roundChatCount = 0; 

            let available = [];
            for (let i = 0; i < scenarios.length; i++) {
                if (!usedPersons.includes(i)) available.push(i);
            }
            if (available.length === 0) {
                available = Array.from({length: scenarios.length}, (_, i) => i); usedPersons = [];
            }

            const idx = available[Math.floor(Math.random() * available.length)];
            usedPersons.push(idx); 
            const scam = scenarios[idx];

            document.getElementById('avatar').textContent = scam.avatar;
            document.getElementById('scam-title').textContent = scam.title;
            document.getElementById('log').innerHTML = scam.baseText;
            currentType = scam.type;

            currentTags = generateFlagsForScenario(scam);

            renderTags(); updateUI();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateChatButton() {
            const btn = document.getElementById('chat-btn');
            const mainText = document.getElementById('chat-text-main');
            const subText = document.getElementById('chat-text-sub');
            
            let globalRemaining = MAX_GLOBAL_CHATS - globalChatCount;
            let roundRemaining = MAX_ROUND_CHATS - roundChatCount;

            if (globalRemaining <= 0 || roundRemaining <= 0) {
                btn.classList.add('btn-disabled'); btn.onclick = null;
                mainText.textContent = `⚠️ 暫無更多線索`;
                subText.textContent = `此輪或全場對話次數已用盡，請做出你的決定！`;
                showHint("⚠️ 暫無更多線索，請做出你的決定！", true);
            } else {
                btn.classList.remove('btn-disabled'); btn.onclick = () => takeAction('chat');
                mainText.textContent = `💬 繼續傾下 (此輪: ${roundRemaining} | 全場: ${globalRemaining})`;
                subText.textContent = `抽絲剝繭核實線索真偽`;
            }
        }

        function takeAction(action) {
            const titleName = document.getElementById('scam-title').textContent;

            if (action === 'chat') {
                if (globalChatCount >= MAX_GLOBAL_CHATS || roundChatCount >= MAX_ROUND_CHATS) return;
                
                globalChatCount++; 
                roundChatCount++; 

                let mysteries = currentTags.filter(t => t.status === 'mystery');
                if (mysteries.length > 0) {
                    // 已修正：完全刪除「隨機濾走/蒸發標籤」的舊代碼。
                    // 現在每按一次對話，必然會隨機抽出一個灰色標籤進行「解密揭秘」，所有 flag 都不會消失！
                    let target = mysteries[Math.floor(Math.random() * mysteries.length)];
                    target.status = (target.origin === 'good') ? 'green' : 'red';
                    
                    // 根據解密出來的標籤狀態，給予精準的心理提示引導
                    if (target.status === 'green') {
                        showHint(`🟢 💡 精明提示：${target.text}（記住呢個正確做法！）`);
                    } else {
                        showHint(`🔴 🚨 識破破綻：${target.text}（呢個係騙徒嘅馬腳！）`);
                    }
                } else {
                    showHint("💬 對方神色開始慌張/急躁，但你已經無辦法獲得更多資訊。");
                }
                
                renderTags(); updateUI();
                return;
            }

            if (action === 'small') {
                if (currentType !== "good") {
                    riskPoints += 1; 
                    history.push({ round: round, action: `在【${titleName}】中動搖分批轉小額`, risk: 1, type: 'wrong' });
                } else {
                    history.push({ round: round, action: `在【${titleName}】中支援親友小額`, risk: 0, type: 'correct' });
                }
            } else if (action === 'big') {
                if (currentType === "scam") {
                    riskPoints += 3; 
                    history.push({ round: round, action: `落入陷阱！在【${titleName}】中一次過轉大額`, risk: 3, type: 'wrong' });
                } else {
                    history.push({ round: round, action: `在【${titleName}】中全力援助親友`, risk: 0, type: 'correct' });
                }
            } else if (action === 'refuse') {
                if (currentType === "good") {
                    hasWronglyRefusedGood = true; 
                    history.push({ round: round, action: `誤判！拒絕了真正需要幫忙的親友【${titleName}】`, risk: 0, type: 'warn' });
                } else {
                    history.push({ round: round, action: `英明！果斷拒絕並封鎖了騙徒【${titleName}】`, risk: 0, type: 'correct' });
                }
            }

            if (round >= TOTAL_ROUNDS) { endGame(); } else { round++; showNewScam(); }
        }

        function goToCheck() {
            if (checkUsed) return;
            checkUsed = true; document.getElementById('check-btn').classList.add('btn-disabled'); document.getElementById('check-btn').onclick = null;
            let result = currentType === "good" ? "🛡️ 經核實，對方講嘅身份同情況屬實，係真正嘅親友。" : "🚨 極度危險！！呢個係利用新技術或話術嘅金錢詐騙陷阱！對方絕對係騙徒！";
            
            history.push({ round: round, action: `機警！打防騙易熱線查證【${document.getElementById('scam-title').textContent}】`, risk: 0, type: 'correct' });
            document.getElementById('modal-message').textContent = result + "\n\n(熱線已成功為你攔截本次風險，本輪直接安全跳過！)";
            document.getElementById('modal-screen').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-screen').classList.add('hidden');
            if (round >= TOTAL_ROUNDS) { endGame(); } else { round++; updateUI(); showNewScam(); }
        }

        function endGame() {
            document.getElementById('game-container').classList.add('hidden');
            const screen = document.getElementById('end-screen'); screen.classList.remove('hidden');
            document.getElementById('end-round-status').textContent = `你最終成功挑戰了全部 ${TOTAL_ROUNDS} 輪遊戲。`;

            let title, message, iconClass, iconEmoji;

            if (riskPoints >= 4) {
                iconEmoji = "💀"; title = "傾家蕩產！🚨😭😭😭🚨"; message = `你累積了 ${riskPoints} 點高危操作。辛苦大半世嘅錢財全部被搬空！`; iconClass = "text-red-600";
            } else if (riskPoints === 0 && !hasWronglyRefusedGood) {
                iconEmoji = "👑"; title = "傳奇·神級防騙大師！🏆"; message = "天衣無縫！你完美看穿所有新科技與生活詐騙陷阱，同時精準向真親友施以援手！"; iconClass = "text-emerald-400";
            } else if (riskPoints === 0 && hasWronglyRefusedGood) {
                iconEmoji = "🌵"; title = "孤獨防禦型老友記"; message = "你成功守住了每一分每一豪。可惜你因為過度防備，誤將真正身陷困境的親人拒之門外。"; iconClass = "text-yellow-400";
            } else if (riskPoints <= 2) {
                iconEmoji = "⚠️"; title = "精明老友記（守住老本）"; message = `雖然中途有 ${riskPoints} 次不小心做咗危險嘗試，但整體老本安然無損！`; iconClass = "text-amber-400";
            } else {
                iconEmoji = "❌"; title = "損失慘重，防線失守"; message = `你累積了 ${riskPoints} 點風險。部分血汗錢已經不幸落入騙徒口袋！`; iconClass = "text-rose-500";
            }

            document.getElementById('end-icon').textContent = iconEmoji; 
            document.getElementById('end-title').textContent = title;
            document.getElementById('end-title').className = `text-2xl font-black mb-2 ${iconClass}`; 
            document.getElementById('end-message').textContent = message;

            let h = history.length === 0 ? '<p class="text-emerald-400 font-bold">✅ 完美紀錄：你無進行過任何危險交易。</p>' : history.map(h => {
                let colorClass = 'text-rose-400'; let prefixSign = '🔴';
                if (h.type === 'correct') { colorClass = 'text-emerald-400'; prefixSign = '🟢'; } 
                else if (h.type === 'warn') { colorClass = 'text-yellow-400'; prefixSign = '🟡'; }
                return `<p class="${colorClass}">${prefixSign} 第 ${h.round} 輪：${h.action}</p>`;
            }).join('');
            
            document.getElementById('risk-history').innerHTML = h;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function startGame() {
            document.getElementById('intro-screen').classList.add('hidden'); 
            document.getElementById('game-container').classList.remove('hidden');
            showNewScam();
        }

        function restartGame() {
            round = 1; riskPoints = 0; globalChatCount = 0; roundChatCount = 0; currentTags = []; usedPersons = []; history = []; checkUsed = false; hasWronglyRefusedGood = false;
            document.getElementById('end-screen').classList.add('hidden'); 
            document.getElementById('game-container').classList.remove('hidden');
            document.getElementById('check-btn').classList.remove('btn-disabled'); 
            document.getElementById('check-btn').onclick = () => goToCheck();
            showNewScam();
        }
    </script>
